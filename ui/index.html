<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jolley - Synthesizer UI</title>

  <!-- IMPORT MAP: Maps bare specifiers to real paths -->
  <script type="importmap">
  {
    "imports": {
      "@juce-framework/webview": "./src/juce-webview.js"
    }
  }
  </script>

  <style>
    /*
    :root {
      background: #128212;
    }
    */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: #121212;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /*
     * Resizable DAW window that contains the synth canvas.
     */
    #daw-window {
      position: relative;
      width: 1000px;
      height: 660px;
      min-width: 400px;
      min-height: 240px;
    /*  resize: both;*/
      overflow: hidden;
      border: 2px solid #2a2a2a;
      border-radius: 6px;
      background: #121212;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /*
     * The synth canvas fills the DAW window.
     */
    #pluginCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  
<div id="daw-window">
  <div id="synth-wrapper">
    <canvas id="pluginCanvas" width="1000" height="660"></canvas>
  </div>
</div>

<!-- Loads the modular synth entry point -->
<script type="module" src="./src/main.js"></script>

</body>
</html>
